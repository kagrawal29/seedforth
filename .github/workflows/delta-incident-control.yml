name: Delta incident control

on:
  push:
    paths:
      - .github/workflows/delta-incident-control.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to perform
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - restart-channels

permissions:
  contents: read
  issues: write

concurrency:
  group: delta-incident-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELTA_SSH_PRIVATE_KEY: ${{ secrets.DELTA_SSH_PRIVATE_KEY }}
      DELTA_SSH_USER: ${{ secrets.DELTA_SSH_USER }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check incident-control credentials
        id: readiness
        shell: bash
        run: |
          if [ -n "$DELTA_SSH_PRIVATE_KEY" ] && [ -n "$DELTA_SSH_USER" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Incident-control SSH credentials are configured.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Incident-control SSH credentials are not configured. Required repository secrets: DELTA_SSH_PRIVATE_KEY and DELTA_SSH_USER.' | tee "$RUNNER_TEMP/readiness.txt"
          fi
      - name: Report missing control path
        if: ${{ steps.readiness.outputs.ready != 'true' }}
        run: gh issue comment 50 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/readiness.txt"
      - name: Stop when credentials are absent
        if: ${{ github.event_name == 'workflow_dispatch' && steps.readiness.outputs.ready != 'true' }}
        run: exit 1
      - name: Configure ephemeral SSH key
        if: ${{ github.event_name == 'workflow_dispatch' && steps.readiness.outputs.ready == 'true' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DELTA_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 143.110.226.214 >> ~/.ssh/known_hosts
      - name: Read-only server and Mycelium diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnose' && steps.readiness.outputs.ready == 'true' }}
        run: |
          python3 operations/reconcile.py --server "$DELTA_SSH_USER@143.110.226.214" --graph "$DELTA_SSH_USER@143.110.226.214" > "$RUNNER_TEMP/reconcile.json"
          ssh "$DELTA_SSH_USER@143.110.226.214" 'systemctl is-active delta whatsapp-webhook 2>&1 || true; systemctl --no-pager --full status delta whatsapp-webhook 2>&1 | tail -120 || true' > "$RUNNER_TEMP/services.txt"
          sed -E -i 's/(token|secret|password|key)=[^[:space:]]+/\1=[REDACTED]/Ig' "$RUNNER_TEMP/services.txt"
      - name: Upload diagnostic evidence
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnose' && steps.readiness.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: delta-incident-diagnostics
          path: |
            ${{ runner.temp }}/reconcile.json
            ${{ runner.temp }}/services.txt
          retention-days: 7
      - name: Report diagnostic checkpoint
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnose' && steps.readiness.outputs.ready == 'true' }}
        run: gh issue comment 50 --repo "$GITHUB_REPOSITORY" --body "Read-only server diagnostics completed. Evidence: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Restart only channel services
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'restart-channels' && steps.readiness.outputs.ready == 'true' }}
        run: |
          ssh "$DELTA_SSH_USER@143.110.226.214" 'sudo systemctl restart delta whatsapp-webhook && systemctl is-active delta whatsapp-webhook'
          gh issue comment 50 --repo "$GITHUB_REPOSITORY" --body "Explicit recovery restarted only Delta and WhatsApp webhook services. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. End-to-end verification is still required."