name: Delta2 incident control

on:
  push:
    paths:
      - .github/workflows/delta-incident-control.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to perform on Delta2
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - restart-channels

permissions:
  contents: read
  issues: write

concurrency:
  group: delta2-incident-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELTA2_HOST: ${{ secrets.DELTA2_HOST }}
      DELTA2_SSH_PRIVATE_KEY: ${{ secrets.DELTA2_SSH_PRIVATE_KEY }}
      DELTA2_SSH_PASSWORD: ${{ secrets.DELTA2_SSH_PASSWORD }}
      DELTA2_SSH_USER: ${{ secrets.DELTA2_SSH_USER }}
      SSHPASS: ${{ secrets.DELTA2_SSH_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Delta2 incident-control credentials
        id: readiness
        shell: bash
        run: |
          if [ -n "$DELTA2_HOST" ] && [ -n "$DELTA2_SSH_USER" ] && { [ -n "$DELTA2_SSH_PRIVATE_KEY" ] || [ -n "$DELTA2_SSH_PASSWORD" ]; }; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Delta2 host, SSH user, and an SSH authentication method are configured.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Delta2 incident control is blocked. Configure DELTA2_HOST, DELTA2_SSH_USER, and either DELTA2_SSH_PRIVATE_KEY or DELTA2_SSH_PASSWORD. The obsolete Delta host will not be used.' | tee "$RUNNER_TEMP/readiness.txt"
          fi
      - name: Report missing Delta2 control path
        if: ${{ steps.readiness.outputs.ready != 'true' }}
        run: gh issue comment 50 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/readiness.txt"
      - name: Stop dispatched run when Delta2 credentials are absent
        if: ${{ github.event_name == 'workflow_dispatch' && steps.readiness.outputs.ready != 'true' }}
        run: exit 1
      - name: Configure ephemeral SSH authentication for Delta2
        if: ${{ github.event_name == 'workflow_dispatch' && steps.readiness.outputs.ready == 'true' }}
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -H "$DELTA2_HOST" >> ~/.ssh/known_hosts
          if [ -n "$DELTA2_SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$DELTA2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo 'Using the configured Delta2 SSH private key.'
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            install -m 700 -d "$RUNNER_TEMP/ssh-bin"
            printf '%s\n' '#!/bin/sh' 'exec sshpass -e /usr/bin/ssh "$@"' > "$RUNNER_TEMP/ssh-bin/ssh"
            chmod 700 "$RUNNER_TEMP/ssh-bin/ssh"
            echo "$RUNNER_TEMP/ssh-bin" >> "$GITHUB_PATH"
            echo 'Using the configured Delta2 SSH password.'
          fi
      - name: Read-only Delta2 and Mycelium diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnose' && steps.readiness.outputs.ready == 'true' }}
        run: |
          python3 operations/reconcile.py --server "$DELTA2_SSH_USER@$DELTA2_HOST" --graph "$DELTA2_SSH_USER@$DELTA2_HOST" > "$RUNNER_TEMP/reconcile.json"
          ssh "$DELTA2_SSH_USER@$DELTA2_HOST" 'systemctl is-active delta whatsapp-webhook 2>&1 || true; systemctl --no-pager --full status delta whatsapp-webhook 2>&1 | tail -120 || true' > "$RUNNER_TEMP/services.txt"
          sed -E -i 's/(token|secret|password|key)=[^[:space:]]+/\1=[REDACTED]/Ig' "$RUNNER_TEMP/services.txt"
      - name: Upload diagnostic evidence
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnose' && steps.readiness.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: delta2-incident-diagnostics
          path: |
            ${{ runner.temp }}/reconcile.json
            ${{ runner.temp }}/services.txt
          retention-days: 7
      - name: Report diagnostic checkpoint
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnose' && steps.readiness.outputs.ready == 'true' }}
        run: gh issue comment 50 --repo "$GITHUB_REPOSITORY" --body "Read-only Delta2 diagnostics completed. Evidence: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Restart only Delta2 channel services
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'restart-channels' && steps.readiness.outputs.ready == 'true' }}
        run: |
          ssh "$DELTA2_SSH_USER@$DELTA2_HOST" 'sudo systemctl restart delta whatsapp-webhook && systemctl is-active delta whatsapp-webhook'
          gh issue comment 50 --repo "$GITHUB_REPOSITORY" --body "Explicit recovery restarted only Delta2 channel services. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. End-to-end verification is still required."
