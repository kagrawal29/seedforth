name: Delta incident control

on:
  push:
    paths:
      - .github/workflows/delta-incident-control.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to perform
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - restart-channels

permissions:
  contents: read
  issues: write

concurrency:
  group: delta-incident-control
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      ssh_ready: ${{ steps.check.outputs.ssh_ready }}
    steps:
      - id: check
        name: Check incident-control credentials
        env:
          DELTA_SSH_PRIVATE_KEY: ${{ secrets.DELTA_SSH_PRIVATE_KEY }}
          DELTA_SSH_USER: ${{ secrets.DELTA_SSH_USER }}
        shell: bash
        run: |
          if [ -n "$DELTA_SSH_PRIVATE_KEY" ] && [ -n "$DELTA_SSH_USER" ]; then
            echo 'ssh_ready=true' >> "$GITHUB_OUTPUT"
            printf 'Incident-control SSH credentials are configured.\n' > "$RUNNER_TEMP/readiness.txt"
          else
            echo 'ssh_ready=false' >> "$GITHUB_OUTPUT"
            printf 'Incident-control SSH credentials are not configured. Required repository secrets: DELTA_SSH_PRIVATE_KEY and DELTA_SSH_USER.\n' > "$RUNNER_TEMP/readiness.txt"
          fi
          cat "$RUNNER_TEMP/readiness.txt"
      - name: Report missing control path
        if: steps.check.outputs.ssh_ready != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment 50 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/readiness.txt"

  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' && needs.readiness.outputs.ssh_ready == 'true'
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure ephemeral SSH key
        env:
          DELTA_SSH_PRIVATE_KEY: ${{ secrets.DELTA_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DELTA_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 143.110.226.214 >> ~/.ssh/known_hosts
      - name: Inspect repositories and Mycelium
        env:
          DELTA_SSH_USER: ${{ secrets.DELTA_SSH_USER }}
        run: |
          python3 operations/reconcile.py --server "$DELTA_SSH_USER@143.110.226.214" --graph "$DELTA_SSH_USER@143.110.226.214" > "$RUNNER_TEMP/reconcile.json"
          python3 -m json.tool "$RUNNER_TEMP/reconcile.json"
      - name: Collect channel service evidence
        env:
          DELTA_SSH_USER: ${{ secrets.DELTA_SSH_USER }}
        run: |
          ssh "$DELTA_SSH_USER@143.110.226.214" 'set -o pipefail; systemctl is-active delta whatsapp-webhook 2>&1 || true; systemctl --no-pager --full status delta whatsapp-webhook 2>&1 | tail -120 || true' > "$RUNNER_TEMP/services.txt"
          sed -E 's/(token|secret|password|key)=[^[:space:]]+/\1=[REDACTED]/Ig' "$RUNNER_TEMP/services.txt"
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: delta-incident-diagnostics
          path: |
            ${{ runner.temp }}/reconcile.json
            ${{ runner.temp }}/services.txt
          retention-days: 7
      - name: Post diagnostic checkpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'Read-only server diagnostics completed. Evidence: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/comment.txt"
          gh issue comment 50 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.txt"

  restart_channels:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'restart-channels' && needs.readiness.outputs.ssh_ready == 'true'
    needs: readiness
    runs-on: ubuntu-latest
    environment: delta-production
    timeout-minutes: 10
    steps:
      - name: Configure ephemeral SSH key
        env:
          DELTA_SSH_PRIVATE_KEY: ${{ secrets.DELTA_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DELTA_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 143.110.226.214 >> ~/.ssh/known_hosts
      - name: Restart only channel services
        env:
          DELTA_SSH_USER: ${{ secrets.DELTA_SSH_USER }}
        run: ssh "$DELTA_SSH_USER@143.110.226.214" 'sudo systemctl restart delta whatsapp-webhook && systemctl is-active delta whatsapp-webhook'
      - name: Record recovery attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment 50 --repo "$GITHUB_REPOSITORY" --body "Explicit GitHub Actions recovery restarted only Delta and WhatsApp webhook services. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. End-to-end channel verification is still required."