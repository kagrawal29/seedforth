# Closed application ingress until real OAuth and scoped routing are qualified.
server {
    listen 80 default_server;
    server_name 185.192.96.100;
    server_tokens off;
    access_log off;
    if ($host != "185.192.96.100") { return 421; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/seedforth-acme;
        default_type text/plain;
        autoindex off;
        disable_symlinks on;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name 185.192.96.100;
    server_tokens off;
    access_log off;
    ssl_certificate /opt/seedforth/shared/acme-production/config/live/seedforth-control-ip/fullchain.pem;
    ssl_certificate_key /opt/seedforth/shared/acme-production/config/live/seedforth-control-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    if ($host != "185.192.96.100") { return 421; }
    location / { return 503; }
}
