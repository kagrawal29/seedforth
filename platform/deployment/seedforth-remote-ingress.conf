# SeedForth public ingress. Only the reviewed identity/OAuth/MCP paths are
# proxied; the control board and graph remain loopback-only.
limit_req_zone $binary_remote_addr zone=seedforth_public_auth:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name 185.192.96.100;
    server_tokens off;
    access_log off;
    if ($host != "185.192.96.100") { return 421; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/seedforth-acme;
        default_type text/plain;
        autoindex off;
        disable_symlinks on;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name 185.192.96.100;
    server_tokens off;
    access_log off;
    ssl_certificate /opt/seedforth/shared/acme-production/config/live/seedforth-control-ip/fullchain.pem;
    ssl_certificate_key /opt/seedforth/shared/acme-production/config/live/seedforth-control-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    if ($host != "185.192.96.100") { return 421; }
    limit_req_status 429;
    location = / { return 302 /login; }

    # OAuth discovery and protocol endpoints.
    location = /.well-known/oauth-protected-resource/mcp { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /.well-known/oauth-authorization-server { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /register { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /authorize { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /token { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /revoke { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # Human identity and consent pages.
    location = /login { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /logout { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /enroll { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /enroll/start { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /enroll/finish { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /account { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /consent { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /sessions/revoke { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /identity.css { proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # Streamable MCP. Keep the upstream connection reusable and do not buffer
    # event/JSON responses; the application still performs bearer validation.
    location = /mcp { limit_req zone=seedforth_public_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8788; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; proxy_read_timeout 35s; client_body_timeout 10s; }

    location / { return 404; }
}
