# SeedForth Mycelium configuration.
# Secrets are supplied at runtime; this file contains no credentials.

team: []
repos: []

settings:
  max_rules: 20
  staleness_warn_days: 7
  staleness_decay_days: 14
  relevance_threshold: 2
  max_procedure_chars: 3575
  confidence_gate: medium

cadence:
  synthesis_interval_hours: 14
  work_hours_start: 10
  work_hours_end: 22
  entry_feedback: daily
  skill_feedback_interval_days: 2
  distribution: after_gates

models:
  ingest: sonnet
  synthesis: sonnet
  heimdall: sonnet
  pre_dist_audit: sonnet
  entry_feedback: sonnet
  skill_feedback: sonnet
  demand: sonnet
  distribution: none

langsmith:
  api_key_env: CC_LANGSMITH_API_KEY
  base_url: https://api.smith.langchain.com/api/v1

graph:
  neo4j_bolt: bolt://185.192.96.100:7687
  neo4j_user: neo4j
  # Pulse and FalkorDB are historical dependencies, not active infrastructure.
  embedding_model: text-embedding-3-small

artifact_patterns:
  - "**/playbook/**"
  - "**/learnings*"
  - "**/CLAUDE.md"
  - "**/AGENTS.md"
  - "**/*rules*"
  - "**/*guide*"
  - "**/docs/research/**"
  - "**/docs/architecture/**"
